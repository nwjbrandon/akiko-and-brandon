<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14060f" />
    <meta
      name="description"
      content="Three days for two in Fukui — Tsuruga, the Echizen Crab Festival, Ichijōdani and Eiheiji, 21–23 November 2026 — with a dinner in Yokohama either side."
    />
    <title>Fukui, for Two</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem("fukui26-theme")
          var theme = stored === "light" || stored === "dark" ? stored : "dark"
          document.documentElement.classList.remove("light", "dark")
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
